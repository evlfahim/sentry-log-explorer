<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' 'unsafe-inline';">
  <title>Sentry Log Explorer</title>
  <link rel="stylesheet" href="./index.css">
</head>
<body>
  <div id="root">
    <div class="app">
      <header class="app-header">
        <h1>Sentry Log Explorer</h1>
        <span class="file-name" id="fileName"></span>
      </header>

      <div class="app-toolbar">
        <button id="openFileBtn" class="btn btn-primary">Open File</button>
        <button id="openActiveBtn" class="btn btn-secondary">Open Active</button>

        <div id="followToggle" class="btn btn-warning">⚪ Follow</div>

        <div class="query-actions">
          <button id="saveQueryBtn" class="btn btn-secondary">Save Query</button>
          <button id="exportQueryBtn" class="btn btn-secondary">Export</button>
          <button id="importQueryBtn" class="btn btn-secondary">Import</button>
        </div>
      </div>

      <div class="filter-bar">
        <select id="levelFilter">
          <option value="">All Levels</option>
          <option value="TRACE">TRACE</option>
          <option value="DEBUG">DEBUG</option>
          <option value="INFO">INFO</option>
          <option value="WARN">WARN</option>
          <option value="ERROR">ERROR</option>
          <option value="FATAL">FATAL</option>
        </select>
        <input type="datetime-local" id="timeStart" placeholder="Start time">
        <input type="datetime-local" id="timeEnd" placeholder="End time">
        <input type="text" id="patternFilter" placeholder="Regex pattern...">
        <button id="clearFiltersBtn" class="btn btn-small">Clear</button>
      </div>

      <div class="highlight-bar">
        <input type="text" id="highlightPattern" placeholder="Highlight pattern...">
        <input type="color" id="highlightColor" value="#ffff00">
        <button id="addHighlightBtn" class="btn btn-small">Add</button>
        <div id="highlightPatterns" class="highlight-patterns-list"></div>
      </div>

      <div id="savedQueriesPanel" class="saved-queries-panel">
        <h3>Saved Queries</h3>
        <div id="savedQueriesList" class="saved-queries-list"></div>
      </div>

      <div id="errorBanner" class="error-banner" style="display:none;"></div>

      <div id="loadingIndicator" class="loading" style="display:none;">Loading...</div>

      <div id="logListContainer" class="log-list-container">
        <div id="logListViewport" class="log-list-viewport">
          <div id="logListContent" class="log-list-content"></div>
        </div>
        <div id="logListEmpty" class="log-list-empty">
          <p>No log file loaded. Click "Open File" to get started.</p>
        </div>
        <div id="logListNoLines" class="log-list-no-lines" style="display:none;"></div>
        <div class="log-list-footer" id="logListFooter">
          Showing 0 of 0 lines
        </div>
      </div>
    </div>
  </div>

  <script src="./index.js"></script>
</body>
</html>
